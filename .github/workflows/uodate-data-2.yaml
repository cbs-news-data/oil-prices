name: run-oil-prices

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *"  # 6:00am ET during DST; 5:00am ET during EST
    - cron: "0 11 * * *"  # 7:00am ET during DST; 6:00am ET during EST
  workflow_dispatch:

concurrency:
  group: run-oil-prices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    env:
      DW_API_KEY: ${{ secrets.DW_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # Single fast dependency install path + caching
      - name: Install dependencies (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # pak is used under the hood; include explicitly to avoid surprises
          packages: |
            any::pak
            any::tidyverse
            any::janitor
            any::xml2
            any::jsonlite
            any::stringr
            any::lubridate
            any::readr
            any::httr2
            any::jsonlite
            github::munichrocker/DatawRappr
          cache-version: 2

      - name: Set up environment variables
        run: |
          echo "DW_API_KEY=${{ secrets.DW_API_KEY }}" >> $GITHUB_ENV

      - name: Run oil prices script
        run: Rscript -e 'source("scripts/oil-prices.R")'

      - name: Commit & push if changed
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "update data"
          git push
